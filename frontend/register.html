<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registar Conta - Caminhos de Santiago</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="/css/style.css" />

  <style>
    body {
      background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 15px;
    }

    .auth-card {
      border-radius: 20px;
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.12);
      overflow: hidden;
      background: #ffffff;
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 950px;
    }

    .auth-visual {
      background: linear-gradient(180deg, rgba(14, 61, 103, 0.4) 0%, rgba(14, 61, 103, 0.85) 100%),
                  url('../images/4.webp') no-repeat center center;
      background-size: cover;
      min-height: 540px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 40px;
      color: #ffffff;
    }

    .auth-visual h3 {
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 10px;
    }

    .auth-visual p {
      color: rgba(255, 255, 255, 0.9);
      font-size: 0.95rem;
      margin-bottom: 0;
    }

    .auth-form-wrap {
      padding: 40px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="row g-0">
      <div class="col-md-6 auth-visual d-none d-md-flex">
        <a href="home.html" class="text-white text-decoration-none mb-auto fw-bold" style="letter-spacing: 0.05em;">
          ← Caminhos de Santiago
        </a>
        <h3>Junte-se à Comunidade</h3>
        <p>Crie o seu perfil para guardar rotas favoritas, acumular pontos no desafio e preparar a sua viagem.</p>
      </div>

      <div class="col-12 col-md-6 auth-form-wrap">
        <div class="mb-3 text-center text-md-start">
          <h2 class="fw-bold mb-1" style="color: var(--primary);">Criar Conta</h2>
          <p class="text-muted small">Preencha os campos abaixo para começar.</p>
        </div>

        <form id="registerForm">
          <div class="mb-2">
            <label for="nome" class="form-label">Nome de Utilizador</label>
            <input type="text" class="form-control" id="nome" placeholder="ex: João Silva" required />
          </div>

          <div class="mb-2">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" placeholder="exemplo@email.com" required />
          </div>

          <div class="mb-2">
            <label for="password" class="form-label">Senha</label>
            <input type="password" class="form-control" id="password" placeholder="••••••••" required />
          </div>

          <div class="mb-3">
            <label for="confirmPassword" class="form-label">Confirmar Senha</label>
            <input type="password" class="form-control" id="confirmPassword" placeholder="••••••••" required />
          </div>

          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="TermosECondiçoes" />
            <label class="form-check-label small" for="TermosECondiçoes">
              Concordo com os <a target="_blank" href="https://www.youtube.com/watch?v=xvFZjo5PgG0" class="text-decoration-none fw-semibold">termos e condições</a>
            </label>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2" id="myRegisterBtn" disabled>
            Registar Conta
          </button>

          <div id="error-message" class="text-danger text-center small mt-2 fw-semibold"></div>

          <p class="mt-3 text-center text-muted small mb-0">
            Já tem uma conta? <a href="login.html" class="fw-bold text-decoration-none" style="color: var(--primary);">Faça login aqui</a>
          </p>
          <p class="text-center mt-2 mb-0">
            <a href="home.html" class="text-muted small text-decoration-none">Voltar à página inicial</a>
          </p>
        </form>
      </div>
    </div>
  </div>

  <script type="module" src="../js/Views/registerView.js" defer></script>
</body>
</html>
