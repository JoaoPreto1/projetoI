<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gerir Caminhos - Painel do Administrador</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="/css/style.css" />

  <style>
    body { 
      padding-top: 86px; 
      background-color: var(--bg-main); 
    }

    .badge-moderada { 
      background-color: #fef3c7 !important; 
      color: #92400e !important; 
      border: 1px solid #fde68a;
    }

    .badge-alta { 
      background-color: #fee2e2 !important; 
      color: #991b1b !important; 
      border: 1px solid #fecaca;
    }

    .badge-facil { 
      background-color: #d1fae5 !important; 
      color: #065f46 !important; 
      border: 1px solid #a7f3d0;
    }

    .card-coord { 
      font-size: 0.88rem; 
      color: var(--text-muted); 
    }

    .variant-list { 
      font-size: 0.88rem; 
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg fixed-top custom-navbar">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand" href="admin.html">Gerir Caminhos</a>
      <div class="d-flex gap-2">
        <button id="backButton" class="btn btn-light btn-sm text-primary fw-semibold px-3">
          <i class="fas fa-arrow-left me-1"></i> Voltar ao Painel
        </button>
        <button id="logoutButton" class="btn btn-outline-light btn-sm fw-semibold px-3">
          <i class="fas fa-sign-out-alt me-1"></i> Logout
        </button>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
      <div>
        <h2 class="fw-bold mb-1">Catálogo de Caminhos</h2>
        <p class="text-muted small mb-0">Consulte, altere ou adicione percursos ao banco de dados.</p>
      </div>
      <button class="btn btn-success px-3 py-2 shadow-xs" onclick="abrirModalAdicionar()">
        <i class="fas fa-plus me-1"></i> Adicionar Caminho
      </button>
    </div>

    <div id="caminhosContainer" class="row g-4"></div>
  </main>

  <script>
    const API_URL = 'http://localhost:3000/caminhos';

    function getBadgeClass(dificuldade) {
      switch ((dificuldade || '').toLowerCase()) {
        case 'difícil': return 'badge-alta';
        case 'moderado': return 'badge-moderada';
        case 'fácil': return 'badge-facil';
        default: return 'bg-secondary';
      }
    }

    async function carregarCaminhos() {
      try {
        const res = await fetch(API_URL);
        const caminhos = await res.json();
        const container = document.getElementById('caminhosContainer');
        container.innerHTML = '';

        caminhos.forEach(caminho => {
          const card = document.createElement('div');
          card.className = 'col-md-6 col-lg-4';

          const variantes = (caminho.variantes && caminho.variantes.length > 0) ? caminho.variantes.map(v => `
            <li class="list-group-item px-3 py-2 bg-transparent">
              <strong>${v.nome}</strong> <span class="badge bg-light text-dark ms-1">${v.distancia}</span><br>
              <small class="text-muted">${v.descricao}</small>
            </li>
          `).join('') : '<li class="list-group-item text-muted px-3 py-2 bg-transparent">Sem variantes registadas</li>';

          card.innerHTML = `
            <div class="card h-100 shadow-sm border-0 d-flex flex-column" style="border-radius: 16px;">
              <div class="card-body p-4 d-flex flex-column">
                <div class="d-flex justify-content-between align-items-start mb-2">
                  <h5 class="card-title fw-bold mb-0">${caminho.nome}</h5>
                  <span class="badge ${getBadgeClass(caminho.dificuldade)} rounded-pill">${caminho.dificuldade || 'Desconhecida'}</span>
                </div>
                <p class="card-text text-muted mb-3">${caminho.descricao[0]}</p>
                <p class="card-coord mb-3"><i class="fas fa-map-marker-alt text-danger me-1"></i> ${caminho.latitude}, ${caminho.longitude}</p>

                <div class="accordion mb-3 mt-auto" id="variantes-${caminho.id}">
                  <div class="accordion-item border-0 bg-light rounded-3 overflow-hidden">
                    <h2 class="accordion-header" id="heading-${caminho.id}">
                      <button class="accordion-button collapsed py-2 px-3 bg-light text-dark small fw-semibold" type="button" data-bs-toggle="collapse"
                        data-bs-target="#collapse-${caminho.id}" aria-expanded="false" aria-controls="collapse-${caminho.id}">
                        Variantes (${caminho.variantes ? caminho.variantes.length : 0})
                      </button>
                    </h2>
                    <div id="collapse-${caminho.id}" class="accordion-collapse collapse" aria-labelledby="heading-${caminho.id}" data-bs-parent="#variantes-${caminho.id}">
                      <ul class="list-group list-group-flush variant-list">
                        ${variantes}
                      </ul>
                    </div>
                  </div>
                </div>

                <div class="d-flex gap-2 pt-2 border-top">
                  <button class="btn btn-outline-primary btn-sm flex-fill" onclick="editarCaminho('${caminho.id}')">
                    <i class="fas fa-edit me-1"></i> Editar
                  </button>
                  <button class="btn btn-outline-danger btn-sm flex-fill" onclick="removerCaminho('${caminho.id}')">
                    <i class="fas fa-trash me-1"></i> Remover
                  </button>
                </div>
              </div>
            </div>
          `;

          container.appendChild(card);
        });
      } catch (err) {
        console.error('Erro ao carregar:', err);
        document.getElementById('caminhosContainer').innerHTML = '<p class="text-danger">Erro ao carregar dados.</p>';
      }
    }

    async function removerCaminho(id) {
      if (confirm('Tem certeza que deseja remover este caminho?')) {
        await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
        carregarCaminhos();
      }
    }

    async function editarCaminho(id) {
      try {
        const res = await fetch(`${API_URL}/${id}`);
        const caminho = await res.json();

        const formHtml = `
          <div class="modal fade" id="editarModal" tabindex="-1" aria-labelledby="editarModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
              <form class="modal-content border-0 shadow-lg" id="editarForm" style="border-radius: 18px;">
                <div class="modal-header">
                  <h5 class="modal-title">Editar Caminho</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                  <div class="mb-3">
                    <label class="form-label">Nome</label>
                    <input type="text" class="form-control" name="nome" value="${caminho.nome}" required />
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Descrição</label>
                    <textarea class="form-control" name="descricao" rows="3" required>${caminho.descricao}</textarea>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Dificuldade</label>
                    <select class="form-select" name="dificuldade">
                      <option value="Fácil" ${caminho.dificuldade === 'Fácil' ? 'selected' : ''}>Fácil</option>
                      <option value="Moderado" ${caminho.dificuldade === 'Moderado' ? 'selected' : ''}>Moderado</option>
                      <option value="Difícil" ${caminho.dificuldade === 'Difícil' ? 'selected' : ''}>Difícil</option>
                    </select>
                  </div>
                  <div class="row">
                    <div class="col-md-6 mb-3">
                      <label class="form-label">Latitude</label>
                      <input type="number" step="any" class="form-control" name="latitude" value="${caminho.latitude}" required />
                    </div>
                    <div class="col-md-6 mb-3">
                      <label class="form-label">Longitude</label>
                      <input type="number" step="any" class="form-control" name="longitude" value="${caminho.longitude}" required />
                    </div>
                  </div>
                </div>
                <div class="modal-footer p-3 bg-light">
                  <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                  <button type="submit" class="btn btn-primary">Salvar Alterações</button>
                </div>
              </form>
            </div>
          </div>
        `;

        document.body.insertAdjacentHTML('beforeend', formHtml);
        const modal = new bootstrap.Modal(document.getElementById('editarModal'));
        modal.show();

        document.getElementById('editarForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          const formData = new FormData(e.target);
          const dadosAtualizados = Object.fromEntries(formData.entries());

          await fetch(`${API_URL}/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(dadosAtualizados)
          });

          modal.hide();
          document.getElementById('editarModal').remove();
          carregarCaminhos();
        });

      } catch (err) {
        console.error('Erro ao editar caminho:', err);
        alert('Erro ao carregar os dados para edição.');
      }
    }

    function abrirModalAdicionar() {
      const modalHtml = `
        <div class="modal fade" id="adicionarModal" tabindex="-1" aria-labelledby="adicionarModalLabel" aria-hidden="true">
          <div class="modal-dialog modal-dialog-centered">
            <form class="modal-content border-0 shadow-lg" id="adicionarForm" style="border-radius: 18px;">
              <div class="modal-header">
                <h5 class="modal-title">Adicionar Novo Caminho</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
              </div>
              <div class="modal-body p-4">
                <div class="mb-3">
                  <label class="form-label">Nome</label>
                  <input type="text" class="form-control" name="nome" placeholder="ex: Caminho Português da Costa" required />
                </div>
                <div class="mb-3">
                  <label class="form-label">Descrição</label>
                  <textarea class="form-control" name="descricao" rows="3" placeholder="Descrição da rota..." required></textarea>
                </div>
                <div class="mb-3">
                  <label class="form-label">Dificuldade</label>
                  <select class="form-select" name="dificuldade">
                    <option value="Fácil">Fácil</option>
                    <option value="Moderado">Moderado</option>
                    <option value="Difícil">Difícil</option>
                  </select>
                </div>
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Latitude</label>
                    <input type="number" step="any" class="form-control" name="latitude" placeholder="ex: 41.1579" required />
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Longitude</label>
                    <input type="number" step="any" class="form-control" name="longitude" placeholder="ex: -8.6291" required />
                  </div>
                </div>
              </div>
              <div class="modal-footer p-3 bg-light">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-success">Adicionar</button>
              </div>
            </form>
          </div>
        </div>
      `;

      document.body.insertAdjacentHTML('beforeend', modalHtml);
      const modal = new bootstrap.Modal(document.getElementById('adicionarModal'));
      modal.show();

      document.getElementById('adicionarForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const novoCaminho = Object.fromEntries(formData.entries());

        try {
          await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(novoCaminho)
          });
          modal.hide();
          document.getElementById('adicionarModal').remove();
          carregarCaminhos();
        } catch (err) {
          console.error('Erro ao adicionar caminho:', err);
          alert('Erro ao adicionar caminho.');
        }
      });
    }

    carregarCaminhos();
  </script>

  <script src="../js/Views/adminView.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
