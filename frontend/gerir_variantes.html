<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Variantes - Painel do Administrador</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="/css/style.css">
  
  <style>
    body { 
      padding-top: 86px; 
      background-color: var(--bg-main); 
    }

    .form-popup { 
      display: none; 
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      z-index: 1060;
      overflow-y: auto;
      padding: 40px 15px;
    }

    .form-popup .card {
      max-width: 600px;
      margin: 40px auto;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg fixed-top custom-navbar">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand" href="admin.html">Gestão de Variantes</a>
      <div class="d-flex gap-2">
        <a id="voltar" class="btn btn-light btn-sm text-primary fw-semibold px-3" href="admin.html">
          <i class="fas fa-arrow-left me-1"></i> Voltar ao Painel
        </a>
        <a id="logOut" class="btn btn-outline-light btn-sm fw-semibold px-3" href="login.html">
          <i class="fas fa-sign-out-alt me-1"></i> Logout
        </a>       
      </div>
    </div>
  </nav>

  <main class="container my-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
      <div>
        <h2 class="fw-bold mb-1">Variantes de Percursos</h2>
        <p class="text-muted small mb-0">Rotas secundárias, atalhos e derivações dos caminhos principais.</p>
      </div>
      <button class="btn btn-success px-3 py-2 shadow-xs" id="addVarianteBtn">
        <i class="fas fa-plus me-1"></i> Adicionar Variante
      </button>
    </div>

    <div class="card border-0 shadow-sm" style="border-radius: 16px; overflow: hidden;">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>Descrição</th>
              <th>Distância</th>
              <th class="text-center">Ações</th>
            </tr>
          </thead>
          <tbody id="variantesBody">
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <div class="container form-popup" id="formularioVariantes">
    <div class="card shadow p-4 p-md-5 border-0">
      <h4 id="formTitle" class="fw-bold mb-4" style="color: var(--primary);">Adicionar Variante</h4>
      <div class="mb-3">
        <label for="varianteId" class="form-label">Caminho Principal</label>
        <select class="form-select" name="idSelect" id="varianteId"></select>
      </div>  
      <div class="mb-3">
        <label class="form-label">Nome da Variante</label>
        <input class="form-control" id="nome" placeholder="ex: Rota Costeira Alternativa">
      </div>
      <div class="mb-3">
        <label class="form-label">Descrição</label>
        <input class="form-control" id="descricao" placeholder="Escreva uma breve descrição da variante">
      </div>
      <div class="mb-4">
        <label class="form-label">Distância</label>
        <input class="form-control" id="distancia" placeholder="ex: 120 km">
      </div>
      <div class="d-flex gap-2 justify-content-end">
        <button class="btn btn-outline-secondary px-4" id="closeAddVarianteBtn" type="button" onclick="document.getElementById('formularioVariantes').style.display='none';">Cancelar</button>
        <button class="btn btn-primary px-4" id="guardarAddVarianteBtn" type="button">Guardar Variante</button>
      </div>
    </div>
  </div>

  <div class="container form-popup" id="formularioVarianteEdit">
    <div class="card shadow p-4 p-md-5 border-0">
      <h4 id="formTitle" class="fw-bold mb-4" style="color: var(--primary);">Editar Variante</h4>
      <div class="mb-3">
        <label class="form-label">ID da Variante</label>
        <input type="number" class="form-control" id="VarianteIdE" placeholder="Id" readonly>
      </div>
      <div class="mb-3">
        <label class="form-label">Nome Completo</label>
        <input class="form-control" id="nomeE" placeholder="Nome completo">
      </div>
      <div class="mb-3">
        <label class="form-label">Descrição</label>
        <input class="form-control" id="descricaoE" placeholder="Descrição da variante">
      </div>
      <div class="mb-4">
        <label class="form-label">Distância</label>
        <input class="form-control" id="distanciaE" placeholder="Distância da variante (ex: 85 km)">
      </div>
      <div class="d-flex gap-2 justify-content-end">
        <button class="btn btn-outline-secondary px-4" type="button" onclick="fecharEditFormulario()">Cancelar</button>
        <button class="btn btn-primary px-4" type="button" onclick="editarVarianteView()">Salvar Alterações</button>
      </div>
    </div>
  </div>

  <script type="module" src="../js/Views/gerirVariantesView.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
