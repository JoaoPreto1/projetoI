<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Utilizadores - Painel do Administrador</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="/css/style.css">
  
  <style>
    body { 
      padding-top: 86px; 
      background-color: var(--bg-main); 
    }

    .form-popup { 
      display: none; 
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      z-index: 1060;
      overflow-y: auto;
      padding: 40px 15px;
    }

    .form-popup .card {
      max-width: 600px;
      margin: 40px auto;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg fixed-top custom-navbar">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand" href="admin.html">Gestão de Utilizadores</a>
      <div class="d-flex gap-2">
        <a id="voltar" class="btn btn-light btn-sm text-primary fw-semibold px-3" href="admin.html">
          <i class="fas fa-arrow-left me-1"></i> Voltar ao Painel
        </a>
        <a id="logOut" class="btn btn-outline-light btn-sm fw-semibold px-3" href="login.html">
          <i class="fas fa-sign-out-alt me-1"></i> Logout
        </a>       
      </div>
    </div>
  </nav>

  <main class="container my-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
      <div>
        <h2 class="fw-bold mb-1">Contas Registadas</h2>
        <p class="text-muted small mb-0">Controlo de perfis, permissões e pontuações de jogo.</p>
      </div>
      <button class="btn btn-success px-3 py-2 shadow-xs" id="addUserBtn">
        <i class="fas fa-user-plus me-1"></i> Adicionar Utilizador
      </button>
    </div>

    <div class="card border-0 shadow-sm" style="border-radius: 16px; overflow: hidden;">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>Email</th>
              <th>Password</th>
              <th>Tipo</th>
              <th>Percurso</th>
              <th>Pontos</th>
              <th>Total</th>
              <th class="text-center">Ações</th>
            </tr>
          </thead>
          <tbody id="utilizadoresBody">
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <div class="form-popup" id="formularioUtilizador">
    <div class="card shadow p-4 p-md-5 border-0">
      <h4 id="formTitle" class="fw-bold mb-4" style="color: var(--primary);">Adicionar Utilizador</h4>
      <input type="hidden" id="utilizadorId">
      
      <div class="mb-3">
        <label class="form-label">Nome Completo</label>
        <input class="form-control" id="nome" placeholder="Nome completo">
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input class="form-control" id="email" type="email" placeholder="email@exemplo.com">
      </div>
      <div class="mb-3">
        <label class="form-label">Palavra-passe</label>
        <input class="form-control" id="password" placeholder="senha">
      </div>
      <div class="mb-4">
        <label class="form-label">Tipo de Permissão</label>
        <select class="form-select" id="tipo">
          <option value="user">Utilizador</option>
          <option value="admin">Administrador</option>
        </select>
      </div>
      <div class="d-flex gap-2 justify-content-end">
        <button class="btn btn-outline-secondary px-4" id="closeAddUserBtn">Cancelar</button>
        <button class="btn btn-primary px-4" id="guardarAddUserBtn">Guardar Utilizador</button>
      </div>
    </div>
  </div>

  <div class="form-popup" id="formularioUtilizadorEdit">
    <div class="card shadow p-4 p-md-5 border-0">
      <h4 id="formTitle" class="fw-bold mb-4" style="color: var(--primary);">Editar Utilizador</h4>
      
      <div class="row g-3">
        <div class="col-md-3">
          <label class="form-label">ID</label>
          <input type="number" class="form-control" id="utilizadorIdE" placeholder="Id" readonly>
        </div>
        <div class="col-md-9">
          <label class="form-label">Nome Completo</label>
          <input class="form-control" id="nomeE" placeholder="Nome completo">
        </div>
        <div class="col-md-6">
          <label class="form-label">Email</label>
          <input class="form-control" id="emailE" type="email" placeholder="Email">
        </div>
        <div class="col-md-6">
          <label class="form-label">Palavra-passe</label>
          <input class="form-control" id="passwordE" placeholder="Password">
        </div>
        <div class="col-md-6">
          <label class="form-label">Tipo</label>
          <select class="form-select" id="tipoE">
            <option value="user">Utilizador</option>
            <option value="admin">Administrador</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Percurso</label>
          <input class="form-control" id="percursoE" placeholder="Percurso">
        </div>
        <div class="col-md-6">
          <label class="form-label">Pontos</label>
          <input class="form-control" id="pontosE" placeholder="Pontos">
        </div>
        <div class="col-md-6">
          <label class="form-label">Total</label>
          <input class="form-control" id="totalE" placeholder="Total">
        </div>
      </div>
      
      <div class="d-flex gap-2 justify-content-end mt-4 pt-2">
        <button class="btn btn-outline-secondary px-4" onclick="fecharEditFormulario()">Cancelar</button>
        <button class="btn btn-primary px-4" onclick="editarUtilizadorView()">Salvar Alterações</button>
      </div>
    </div>
  </div>

  <script type="module" src="../js/Views/gerirUserView.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
